# Инвентарь флота для `make deploy`. В РЕПОЗИТОРИИ, а не в gitignore: список хостов проходит
# те же гейты, что код, и разъезд виден в диффе. Секретов тут нет — только ssh-алиасы;
# адреса, пользователи и ключи живут в ~/.ssh/config.
#
# Первый хост — КАНАРЕЙКА: на нём выкатка проверяется целиком, прежде чем трогать остальные.
# Гейты fail-closed, поэтому сломанная версия на всех машинах разом останавливает работу везде.
#
# `channels` ОБЪЯВЛЯЮТСЯ, а не определяются по факту: отсутствие объявленного канала —
# структурный отказ. Иначе сломанный PATH или снесённый бинарь превращались бы в легальный
# «Claude-only хост», и обязательный ревьюер молча оставался бы слепым (так уже было 4 раза).
hosts:
  - id: local
    channels: [claude, codex]
  - id: smartape-vps-1
    channels: [claude, codex]
